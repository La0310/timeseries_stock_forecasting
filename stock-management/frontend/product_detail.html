<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SKU Detail — StockSense</title>
  <meta name="description" content="AI-powered demand forecast, model routing, and replenishment recommendation for a single SKU." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Plotly via CDN -->
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" defer></script>

  <style>
    /* ── Design Tokens ─────────────────────────────────────────────────── */
    :root {
      --bg:           #F8FAFC;
      --bg-card:      #FFFFFF;
      --bg-muted:     #F1F5F9;
      --bg-hover:     #F8FAFC;

      --border:       #E2E8F0;
      --border-focus: #334155;

      --text-primary:   #0F172A;
      --text-secondary: #475569;
      --text-muted:     #94A3B8;

      --accent:         #059669;
      --accent-light:   #ECFDF5;
      --accent-border:  #6EE7B7;

      --slate:          #334155;
      --slate-light:    #F1F5F9;

      --red:        #DC2626;
      --red-light:  #FEF2F2;
      --red-border: #FECACA;

      --amber:        #D97706;
      --amber-light:  #FFFBEB;
      --amber-border: #FDE68A;

      --purple:       #7C3AED;
      --purple-light: #F5F3FF;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;

      --shadow-sm: 0 1px 2px rgba(15,23,42,0.05);
      --shadow-md: 0 1px 3px rgba(15,23,42,0.08), 0 4px 12px rgba(15,23,42,0.05);
      --transition: 0.15s ease;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Layout ────────────────────────────────────────────────────────── */
    .page-wrapper {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 28px 80px;
    }

    /* ── Top Nav ───────────────────────────────────────────────────────── */
    .topnav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }
    .topnav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .topnav-logo {
      width: 34px;
      height: 34px;
      background: var(--slate);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
      flex-shrink: 0;
    }
    .topnav-name { font-size: 16px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.3px; }
    .topnav-name span { color: var(--accent); }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      padding: 7px 13px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: var(--shadow-sm);
      transition: all var(--transition);
    }
    .back-btn:hover { color: var(--text-primary); border-color: var(--border-focus); background: var(--bg-muted); }
    .back-btn:focus-visible { outline: 2px solid var(--slate); outline-offset: 2px; }

    /* ── Breadcrumb ────────────────────────────────────────────────────── */
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }
    .breadcrumb a { color: var(--accent); text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }
    .breadcrumb-sep { color: var(--text-muted); }

    /* ── SKU Hero ──────────────────────────────────────────────────────── */
    .sku-hero {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px 28px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }
    .sku-hero-left { flex: 1 1 340px; }
    .sku-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-light);
      border: 1px solid var(--accent-border);
      border-radius: 20px;
      padding: 3px 10px;
      margin-bottom: 10px;
    }
    .sku-hero h1 {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.4px;
      margin-bottom: 5px;
    }
    .sku-hero-category { font-size: 13px; color: var(--text-secondary); }

    .sku-hero-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }

    /* status badges */
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      border: 1px solid transparent;
    }
    .hero-badge-dot { width: 6px; height: 6px; border-radius: 50%; }
    .hero-badge.critical { background: var(--red-light);   border-color: var(--red-border);   color: var(--red); }
    .hero-badge.critical .hero-badge-dot { background: var(--red); }
    .hero-badge.low      { background: var(--amber-light); border-color: var(--amber-border); color: var(--amber); }
    .hero-badge.low      .hero-badge-dot { background: var(--amber); }
    .hero-badge.healthy  { background: var(--accent-light); border-color: var(--accent-border); color: var(--accent); }
    .hero-badge.healthy  .hero-badge-dot { background: var(--accent); }
    .hero-badge.unknown  { background: var(--bg-muted); border-color: var(--border); color: var(--text-muted); }
    .hero-badge.unknown  .hero-badge-dot { background: var(--text-muted); }

    /* hero meta row */
    .hero-meta { display: flex; gap: 28px; margin-top: 18px; flex-wrap: wrap; }
    .hero-meta-item { display: flex; flex-direction: column; gap: 3px; }
    .hero-meta-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); }
    .hero-meta-value { font-size: 18px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.3px; }

    /* ── Banner ────────────────────────────────────────────────────────── */
    .banner {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 11px 16px;
      border-radius: var(--radius-md);
      font-size: 13px;
      margin-bottom: 20px;
      border: 1px solid;
      animation: fadeIn 0.3s ease;
    }
    .banner-warn { background: var(--amber-light); border-color: var(--amber-border); color: var(--amber); }
    .banner-icon { flex-shrink: 0; font-size: 14px; line-height: 1.5; }
    @keyframes fadeIn { from { opacity:0; transform: translateY(-5px); } to { opacity:1; transform:none; } }

    /* ── Generate Button ───────────────────────────────────────────────── */
    #generate-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--slate);
      border: none;
      border-radius: var(--radius-md);
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 22px;
      cursor: pointer;
      box-shadow: var(--shadow-md);
      transition: opacity var(--transition), transform var(--transition);
      margin-bottom: 24px;
    }
    #generate-btn:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
    #generate-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    #generate-btn:focus-visible { outline: 2px solid var(--slate); outline-offset: 3px; }
    #generate-btn .btn-spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      display: none;
    }
    #generate-btn.loading .btn-spinner { display: block; }
    #generate-btn.loading .btn-icon    { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Analyzing Msg ─────────────────────────────────────────────────── */
    #analyzing-msg {
      display: none;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }
    #analyzing-msg.visible { display: flex; }
    .pulse-dot {
      width: 7px; height: 7px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50%       { opacity: 1;   transform: scale(1.2); }
    }

    /* ── Section Card ──────────────────────────────────────────────────── */
    .section-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      margin-bottom: 16px;
      overflow: hidden;
      animation: fadeIn 0.3s ease;
    }
    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-muted);
    }
    .section-icon {
      width: 28px; height: 28px;
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .icon-blue   { background: #EFF6FF; }
    .icon-purple { background: var(--purple-light); }
    .icon-green  { background: var(--accent-light); }
    .icon-orange { background: var(--amber-light); }

    .section-title { font-size: 14px; font-weight: 600; color: var(--text-primary); }
    .section-subtitle { font-size: 12px; color: var(--text-muted); margin-left: auto; }
    .section-body { padding: 20px; }

    /* ── Stat Grid ─────────────────────────────────────────────────────── */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 10px;
    }
    .stat-item {
      background: var(--bg-muted);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      transition: border-color var(--transition);
    }
    .stat-item:hover { border-color: #CBD5E1; }
    .stat-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 6px; }
    .stat-value { font-size: 20px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.4px; line-height: 1; }
    .stat-value.mono { font-size: 15px; letter-spacing: 0; font-family: 'SF Mono', 'Fira Mono', monospace; }
    .stat-sub  { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

    /* demand class pill */
    .demand-class-pill {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }
    .demand-smooth      { background: var(--accent-light); color: var(--accent); }
    .demand-intermittent{ background: #EFF6FF; color: #2563EB; }
    .demand-erratic     { background: var(--amber-light); color: var(--amber); }
    .demand-lumpy       { background: var(--red-light); color: var(--red); }
    .demand-zero        { background: var(--bg-muted); color: var(--text-muted); }

    /* ── Seasonality Row ───────────────────────────────────────────────── */
    .seasonality-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }
    .seas-card {
      background: var(--bg-muted);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
    }
    .seas-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 8px; }
    .seas-label { font-size: 15px; font-weight: 700; color: var(--text-primary); }
    .seas-acf { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }

    /* ── Model Routing ─────────────────────────────────────────────────── */
    .selected-model-banner {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--slate-light);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      margin-bottom: 16px;
    }
    .selected-model-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--slate);
      letter-spacing: -0.3px;
      white-space: nowrap;
    }
    .selected-model-score { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }
    .selected-model-justification {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
      border-left: 2px solid var(--accent);
      padding-left: 12px;
      flex: 1;
    }

    /* model scores table */
    .model-table { width: 100%; border-collapse: collapse; margin-top: 4px; }
    .model-table th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }
    .model-table td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid var(--border); }
    .model-table tr:last-child td { border-bottom: none; }
    .model-table tr.selected-row td { background: var(--accent-light); }
    .model-table tr:not(.selected-row):hover td { background: var(--bg-hover); }
    .model-name-cell { font-weight: 500; }
    .selected-chip {
      display: inline-block;
      background: var(--accent-light);
      border: 1px solid var(--accent-border);
      color: var(--accent);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-radius: 20px;
      padding: 1px 7px;
      margin-left: 6px;
    }
    .score-bar-wrap { display: flex; align-items: center; gap: 10px; }
    .score-bar-bg {
      flex: 1;
      height: 5px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    .score-bar-fill {
      height: 100%;
      border-radius: 3px;
      background: var(--slate);
      transition: width 0.6s ease;
    }
    .score-bar-fill.selected-fill { background: var(--accent); }
    .score-null { color: var(--text-muted); font-size: 12px; font-style: italic; }

    /* ── Forecast Summary ──────────────────────────────────────────────── */
    .forecast-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .forecast-sum-card {
      background: var(--bg-muted);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      text-align: center;
    }
    .forecast-sum-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 6px; }
    .forecast-sum-value { font-size: 26px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.8px; }
    .forecast-sum-unit  { font-size: 12px; color: var(--text-muted); margin-top: 3px; }

    /* ── Plotly Chart ──────────────────────────────────────────────────── */
    #forecast-chart {
      width: 100%;
      height: 320px;
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    /* ── Replenishment ─────────────────────────────────────────────────── */
    .replenishment-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .order-highlight {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 20px;
      background: var(--accent-light);
      border: 1px solid var(--accent-border);
      border-radius: var(--radius-md);
      padding: 18px 22px;
      flex-wrap: wrap;
    }
    .order-highlight-label { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
    .order-highlight-qty   { font-size: 32px; font-weight: 700; color: var(--accent); letter-spacing: -1px; line-height: 1; }
    .order-highlight-unit  { font-size: 13px; color: var(--text-muted); }
    .order-highlight-cases { font-size: 13px; color: var(--text-secondary); }

    /* ── PO Button ─────────────────────────────────────────────────────── */
    #po-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      border: none;
      border-radius: var(--radius-md);
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 11px 24px;
      cursor: pointer;
      box-shadow: var(--shadow-md);
      text-decoration: none;
      transition: opacity var(--transition), transform var(--transition);
    }
    #po-btn:hover { opacity: 0.88; transform: translateY(-1px); }
    #po-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .po-btn-sub { font-size: 12px; color: var(--text-muted); margin-top: 8px; }

    /* ── Error State ───────────────────────────────────────────────────── */
    .error-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 56px 24px;
      gap: 12px;
      text-align: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }
    .error-box .e-icon { font-size: 32px; }
    .error-box .e-title { font-size: 17px; font-weight: 600; }
    .error-box .e-msg   { font-size: 13px; color: var(--text-secondary); max-width: 400px; }
    .error-box .e-back  {
      margin-top: 10px;
      background: var(--slate);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 20px;
      cursor: pointer;
      text-decoration: none;
      transition: opacity var(--transition);
    }
    .error-box .e-back:hover { opacity: 0.85; }

    /* ── Divider ───────────────────────────────────────────────────────── */
    .divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

    /* ── Skeleton ──────────────────────────────────────────────────────── */
    @keyframes shimmer {
      0%,100% { opacity: 0.5; }
      50%      { opacity: 1; }
    }
    .skel {
      background: var(--bg-muted);
      border-radius: 4px;
      animation: shimmer 1.4s infinite;
      display: block;
    }

    /* ── Responsive ────────────────────────────────────────────────────── */
    @media (max-width: 700px) {
      .sku-hero { flex-direction: column; }
      .sku-hero-right { align-items: flex-start; }
      .forecast-summary { grid-template-columns: repeat(2, 1fr); }
      .seasonality-row  { grid-template-columns: 1fr; }
      .selected-model-banner { flex-direction: column; align-items: flex-start; }
    }
    @media (max-width: 480px) {
      .page-wrapper { padding: 0 14px 60px; }
      .stat-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
<div class="page-wrapper">

  <!-- ── Top Nav ─────────────────────────────────────────────────────── -->
  <nav class="topnav" role="navigation" aria-label="Main navigation">
    <a href="index.html" class="topnav-brand" aria-label="StockSense home">
      <div class="topnav-logo" aria-hidden="true">S</div>
      <span class="topnav-name">Stock<span>Sense</span></span>
    </a>
    <a href="index.html" class="back-btn" id="back-btn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Back to Inventory
    </a>
  </nav>

  <!-- ── Breadcrumb ──────────────────────────────────────────────────── -->
  <nav class="breadcrumb" aria-label="Breadcrumb">
    <a href="index.html">Inventory</a>
    <span class="breadcrumb-sep">›</span>
    <span id="breadcrumb-sku">—</span>
  </nav>

  <!-- ── Main content injected here by JS ──────────────────────────── -->
  <div id="main-content">
    <!-- skeleton hero placeholder while loading -->
    <div class="sku-hero" id="hero-skeleton" aria-busy="true">
      <div style="flex:1">
        <div class="skel" style="width:80px;height:20px;border-radius:20px;margin-bottom:12px"></div>
        <div class="skel" style="width:240px;height:24px;margin-bottom:8px"></div>
        <div class="skel" style="width:120px;height:13px"></div>
        <div style="display:flex;gap:24px;margin-top:18px">
          <div><div class="skel" style="width:60px;height:11px;margin-bottom:6px"></div><div class="skel" style="width:40px;height:20px"></div></div>
          <div><div class="skel" style="width:70px;height:11px;margin-bottom:6px"></div><div class="skel" style="width:30px;height:20px"></div></div>
          <div><div class="skel" style="width:80px;height:11px;margin-bottom:6px"></div><div class="skel" style="width:50px;height:20px"></div></div>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="js/forecast_card.js"></script>
</body>
</html>
