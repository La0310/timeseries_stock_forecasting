<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockSense — Inventory Dashboard</title>
  <meta name="description" content="Real-time inventory management dashboard. Monitor stock levels, sales velocity, and replenishment status across all SKUs." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Design Tokens ─────────────────────────────────────────────────── */
    :root {
      --bg:           #F8FAFC;
      --bg-card:      #FFFFFF;
      --bg-muted:     #F1F5F9;
      --bg-hover:     #F8FAFC;

      --border:       #E2E8F0;
      --border-focus: #334155;

      --text-primary:   #0F172A;
      --text-secondary: #475569;
      --text-muted:     #94A3B8;

      --accent:         #059669;
      --accent-light:   #ECFDF5;
      --accent-border:  #6EE7B7;

      --slate:          #334155;
      --slate-light:    #F1F5F9;

      --red:        #DC2626;
      --red-light:  #FEF2F2;
      --red-border: #FECACA;

      --amber:        #D97706;
      --amber-light:  #FFFBEB;
      --amber-border: #FDE68A;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;

      --shadow-sm: 0 1px 2px rgba(15,23,42,0.05);
      --shadow-md: 0 1px 3px rgba(15,23,42,0.08), 0 4px 12px rgba(15,23,42,0.05);
      --transition: 0.15s ease;
    }

    /* ── Reset ─────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Layout ────────────────────────────────────────────────────────── */
    .page-wrapper {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 28px 64px;
    }

    /* ── Top Nav ───────────────────────────────────────────────────────── */
    .topnav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 36px;
    }
    .topnav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .topnav-logo {
      width: 34px;
      height: 34px;
      background: var(--slate);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
      flex-shrink: 0;
    }
    .topnav-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }
    .topnav-name span { color: var(--accent); }

    .topnav-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .topnav-pill {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--bg-muted);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 10px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }
    #refresh-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      padding: 7px 13px;
      cursor: pointer;
      transition: all var(--transition);
      box-shadow: var(--shadow-sm);
    }
    #refresh-btn:hover {
      color: var(--text-primary);
      border-color: var(--border-focus);
      background: var(--bg-muted);
    }
    #refresh-btn:focus-visible {
      outline: 2px solid var(--slate);
      outline-offset: 2px;
    }

    /* ── Page Header ───────────────────────────────────────────────────── */
    .page-header { margin-bottom: 28px; }
    .page-header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .page-header p {
      color: var(--text-secondary);
      font-size: 14px;
    }

    /* ── KPI Strip ─────────────────────────────────────────────────────── */
    .kpi-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 28px;
    }
    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow var(--transition), border-color var(--transition);
    }
    .kpi-card:hover {
      box-shadow: var(--shadow-md);
      border-color: #CBD5E1;
    }
    .kpi-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
    }
    .kpi-value {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -1.2px;
      color: var(--text-primary);
      line-height: 1;
      margin-top: 4px;
    }
    .kpi-sub { font-size: 12px; color: var(--text-muted); }

    /* left accent bar */
    .kpi-card.critical { border-left: 3px solid var(--red); }
    .kpi-card.low      { border-left: 3px solid var(--amber); }
    .kpi-card.healthy  { border-left: 3px solid var(--accent); }
    .kpi-card.critical .kpi-value { color: var(--red); }
    .kpi-card.low .kpi-value      { color: var(--amber); }
    .kpi-card.healthy .kpi-value  { color: var(--accent); }

    /* skeleton */
    @keyframes shimmer {
      0%,100% { opacity: 0.5; }
      50%      { opacity: 1; }
    }
    .kpi-value.skeleton, .kpi-sub.skeleton {
      background: var(--bg-muted);
      border-radius: 4px;
      animation: shimmer 1.4s infinite;
    }
    .kpi-value.skeleton { width: 56px; height: 30px; }
    .kpi-sub.skeleton   { width: 80px; height: 12px; margin-top: 4px; }

    /* ── Toolbar ───────────────────────────────────────────────────────── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .search-wrap { position: relative; }
    .search-wrap svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }
    #search-input {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 13px;
      padding: 8px 12px 8px 34px;
      width: 220px;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
      box-shadow: var(--shadow-sm);
    }
    #search-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(51,65,85,0.08);
    }
    #search-input::placeholder { color: var(--text-muted); }

    #filter-status {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 13px;
      padding: 8px 10px;
      outline: none;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: border-color var(--transition);
    }
    #filter-status:focus { border-color: var(--border-focus); }

    .toolbar-right { font-size: 12px; color: var(--text-muted); }

    /* ── Table Card ────────────────────────────────────────────────────── */
    .table-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .table-wrap { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; }

    thead { background: var(--bg-muted); border-bottom: 1px solid var(--border); }
    th {
      padding: 11px 16px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      white-space: nowrap;
      user-select: none;
    }
    th.sortable { cursor: pointer; transition: color var(--transition); }
    th.sortable:hover { color: var(--text-primary); }
    th.sort-asc::after  { content: ' ↑'; color: var(--slate); }
    th.sort-desc::after { content: ' ↓'; color: var(--slate); }

    tbody tr {
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background var(--transition);
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--bg-hover); }

    td {
      padding: 14px 16px;
      font-size: 13px;
      color: var(--text-primary);
      vertical-align: middle;
    }

    .cell-product { min-width: 200px; }
    .product-id {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.3px;
      margin-bottom: 2px;
    }
    .product-name { font-weight: 500; }

    .cell-category span {
      display: inline-block;
      background: var(--bg-muted);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .cell-number {
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }
    .cell-number.stock-critical { color: var(--red); }

    /* ── Status Badge ──────────────────────────────────────────────────── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .badge-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .badge-critical { background: var(--red-light);   border-color: var(--red-border);   color: var(--red); }
    .badge-critical .badge-dot { background: var(--red); }
    .badge-low      { background: var(--amber-light); border-color: var(--amber-border); color: var(--amber); }
    .badge-low .badge-dot      { background: var(--amber); }
    .badge-healthy  { background: var(--accent-light); border-color: var(--accent-border); color: var(--accent); }
    .badge-healthy .badge-dot  { background: var(--accent); }
    .badge-unknown  { background: var(--bg-muted); border-color: var(--border); color: var(--text-muted); }
    .badge-unknown .badge-dot  { background: var(--text-muted); }

    /* ── Row chevron ───────────────────────────────────────────────────── */
    .cell-arrow { width: 32px; color: var(--text-muted); text-align: right; }
    tbody tr:hover .cell-arrow { color: var(--text-primary); }

    /* ── Skeleton rows ─────────────────────────────────────────────────── */
    .skeleton-row td { padding: 16px; }
    .skel {
      background: var(--bg-muted);
      border-radius: 4px;
      animation: shimmer 1.4s infinite;
      display: block;
    }
    .skel-sm    { width: 60px;  height: 12px; }
    .skel-md    { width: 120px; height: 12px; }
    .skel-lg    { width: 160px; height: 12px; }
    .skel-num   { width: 45px;  height: 12px; }
    .skel-badge { width: 70px;  height: 20px; border-radius: 20px; }
    .skel-sub   { width: 90px;  height: 10px; margin-top: 4px; }

    /* ── Error / Empty states ──────────────────────────────────────────── */
    .state-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 24px;
      gap: 12px;
      color: var(--text-secondary);
    }
    .state-box .state-icon { font-size: 32px; }
    .state-box .state-title { font-size: 16px; font-weight: 600; color: var(--text-primary); }
    .state-box .state-msg { font-size: 13px; color: var(--text-secondary); text-align: center; max-width: 360px; }
    .state-box button {
      margin-top: 8px;
      background: var(--slate);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 18px;
      cursor: pointer;
      transition: opacity var(--transition);
    }
    .state-box button:hover { opacity: 0.85; }

    /* ── Table Footer ──────────────────────────────────────────────────── */
    .table-footer {
      border-top: 1px solid var(--border);
      padding: 11px 16px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-muted);
    }
    .footer-ts { font-variant-numeric: tabular-nums; }

    /* ── Responsive ────────────────────────────────────────────────────── */
    @media (max-width: 768px) {
      .kpi-strip { grid-template-columns: repeat(2, 1fr); }
      .page-wrapper { padding: 0 16px 40px; }
      #search-input { width: 160px; }
    }
    @media (max-width: 480px) {
      .kpi-strip { grid-template-columns: 1fr 1fr; }
      .topnav-pill { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">

    <!-- ── Top Nav ──────────────────────────────────────────────────────── -->
    <nav class="topnav" role="navigation" aria-label="Main navigation">
      <a href="index.html" class="topnav-brand" aria-label="StockSense home">
        <div class="topnav-logo" aria-hidden="true">S</div>
        <span class="topnav-name">Stock<span>Sense</span></span>
      </a>
      <div class="topnav-right">
        <span class="topnav-pill">B2B Inventory</span>
        <button id="refresh-btn" aria-label="Refresh inventory data">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
            <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
          </svg>
          Refresh
        </button>
      </div>
    </nav>

    <!-- ── Page Header ──────────────────────────────────────────────────── -->
    <header class="page-header">
      <h1>Inventory Dashboard</h1>
      <p>Live replenishment status and demand forecast for all tracked SKUs.</p>
    </header>

    <!-- ── KPI Strip ────────────────────────────────────────────────────── -->
    <section class="kpi-strip" aria-label="Key performance indicators" id="kpi-strip">
      <div class="kpi-card">
        <div class="kpi-label">Total SKUs</div>
        <div class="kpi-value skeleton" id="kpi-total" aria-live="polite">&nbsp;</div>
        <div class="kpi-sub skeleton" id="kpi-total-sub">&nbsp;</div>
      </div>
      <div class="kpi-card critical">
        <div class="kpi-label">Critical</div>
        <div class="kpi-value skeleton" id="kpi-critical" aria-live="polite">&nbsp;</div>
        <div class="kpi-sub skeleton" id="kpi-critical-sub">&nbsp;</div>
      </div>
      <div class="kpi-card low">
        <div class="kpi-label">Low Stock</div>
        <div class="kpi-value skeleton" id="kpi-low" aria-live="polite">&nbsp;</div>
        <div class="kpi-sub skeleton" id="kpi-low-sub">&nbsp;</div>
      </div>
      <div class="kpi-card healthy">
        <div class="kpi-label">Healthy</div>
        <div class="kpi-value skeleton" id="kpi-healthy" aria-live="polite">&nbsp;</div>
        <div class="kpi-sub skeleton" id="kpi-healthy-sub">&nbsp;</div>
      </div>
    </section>

    <!-- ── Toolbar ───────────────────────────────────────────────────────── -->
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="search-wrap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input
            type="search"
            id="search-input"
            placeholder="Search SKU or product…"
            aria-label="Search SKUs"
            autocomplete="off"
          />
        </div>
        <select id="filter-status" aria-label="Filter by status">
          <option value="">All statuses</option>
          <option value="Critical">Critical</option>
          <option value="Low">Low</option>
          <option value="Healthy">Healthy</option>
        </select>
      </div>
      <div class="toolbar-right" id="row-count" aria-live="polite"></div>
    </div>

    <!-- ── Table Card ───────────────────────────────────────────────────── -->
    <div class="table-card" role="region" aria-label="Inventory table">
      <div class="table-wrap">
        <table id="inventory-table" aria-label="SKU inventory status">
          <thead>
            <tr>
              <th class="sortable" data-col="sku_id" id="th-sku" aria-sort="none">Product</th>
              <th class="sortable" data-col="category" id="th-cat">Category</th>
              <th class="sortable" data-col="current_stock" id="th-stock">Current Stock</th>
              <th class="sortable" data-col="sales_week" id="th-sales">Sales /wk</th>
              <th class="sortable" data-col="lead_time_days" id="th-lead">Lead Time (Days)</th>
              <th data-col="status" id="th-status">Status</th>
              <th class="cell-arrow" aria-hidden="true"></th>
            </tr>
          </thead>
          <tbody id="table-body">
            <!-- Skeleton rows injected by JS -->
          </tbody>
        </table>
      </div>
      <div class="table-footer">
        <span id="footer-status">Loading…</span>
        <span class="footer-ts" id="footer-ts"></span>
      </div>
    </div>

  </div><!-- .page-wrapper -->

  <script src="js/inventory_table.js"></script>
</body>
</html>
